<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRL GAMES | FR LEGENDS 2 COMING SOON</title>
    <style>
        /* 全局样式：赛车硬核黑灰底色 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            /* 赛车格子旗暗纹背景与热烈红光渐变 */
            background-image: 
                radial-gradient(circle at center, rgba(234, 32, 39, 0.15) 0%, transparent 70%),
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111 75%), 
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 100% 100%, 40px 40px, 40px 40px, 40px 40px, 40px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 确保中间内容居中，页脚在最下方 */
            align-items: center;
            overflow-x: hidden;
            color: #fff;
            padding-top: 70px; /* 为固定导航栏预留空间 */
        }

        /* 顶部固定导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #000000;
            border-bottom: 2px solid rgba(234, 32, 39, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        /* 导航栏 Logo (最左侧) */
        .navbar-logo {
            font-size: 1.8rem;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: -2px 2px 0px #EA2027;
            transition: color 0.3s ease;
        }

        .navbar-logo:hover {
            color: #FFC312;
        }

        /* 导航栏菜单 (最右侧) */
        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 15px;
            display: block;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: #FFC312;
            text-shadow: 0 0 8px rgba(255, 195, 18, 0.6);
        }

        /* 下拉菜单样式 */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #111111;
            border: 1px solid #333;
            border-top: 3px solid #EA2027;
            min-width: 180px;
            list-style: none;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
            border-radius: 0 0 4px 4px;
        }

        /* 悬浮打开下拉菜单 */
        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item a {
            color: #ccc;
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            padding: 12px 20px;
            display: block;
            transition: all 0.2s ease;
            border-bottom: 1px solid #222;
            white-space: nowrap;
        }

        .dropdown-item:last-child a {
            border-bottom: none;
        }

        .dropdown-item a:hover {
            background-color: #EA2027;
            color: #fff;
            padding-left: 25px; /* 悬浮右移小效果 */
        }

        /* 主视觉容器 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 20px;
            transform: skewX(-4deg); /* 赛车倾斜速度感 */
        }

        /* 顶部装饰线：赛车跑道拉花 */
        .racing-line {
            width: 120px;
            height: 8px;
            background: linear-gradient(90deg, #FFC312, #EE5A24, #EA2027);
            margin: 0 auto 30px auto;
            border-radius: 4px;
            box-shadow: 0 0 15px #EA2027;
        }

        /* 主标题：FRL GAMES */
        .title {
            font-size: 7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            /* 激情火焰红与闪电黄的街头涂鸦描边质感 */
            text-shadow: 
                0 0 10px rgba(234, 32, 39, 0.8),
                0 0 20px rgba(234, 32, 39, 0.5),
                -4px 4px 0px #EA2027,
                -8px 8px 0px #EE5A24,
                -12px 12px 0px #FFC312;
            animation: drift-glow 2s infinite alternate;
        }

        /* 副标题：FR LEGENDS 2 COMING SOON */
        .subtitle {
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-top: 40px;
            letter-spacing: 6px;
            color: #FFC312; /* 氮气加速闪电黄 */
            text-shadow: 0 0 10px rgba(255, 195, 18, 0.6);
            font-style: italic; /* 斜体强调速度感 */
            display: inline-block;
            border-bottom: 3px dashed #EA2027;
            padding-bottom: 10px;
        }

        /* 公司信息页脚 */
        .company-footer {
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(15,15,15,0.7) 100%);
            border-top: 2px solid rgba(234, 32, 39, 0.3); /* 暗红赛道分隔线 */
            padding: 30px 20px;
            z-index: 10;
            font-family: 'Arial', sans-serif; /* 公司文本使用易读字体 */
            font-size: 0.9rem;
            color: #aaa;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* 页脚左侧：版权与公司全称 */
        .footer-left .company-name {
            font-family: 'Impact', sans-serif;
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* 页脚中间：联系方式与商务条款 */
        .footer-center {
            display: flex;
            gap: 25px;
        }

        .footer-center a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-center a:hover {
            color: #FFC312; /* 悬浮变成闪电黄 */
        }

        /* 页脚右侧：社交媒体/社区链接占位 */
        .footer-right .social-links {
            display: flex;
            gap: 15px;
        }

        .footer-right .social-icon {
            display: inline-block;
            width: 35px;
            height: 35px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            text-align: center;
            line-height: 35px;
            font-weight: bold;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Impact', sans-serif;
            transition: all 0.3s ease;
        }

        .footer-right .social-icon:hover {
            background: #EA2027; /* 悬浮变成赛道红 */
            border-color: #EA2027;
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(234, 32, 39, 0.4);
        }

        /* 底部背景烟雾 */
        .smoke-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at bottom, rgba(238, 90, 36, 0.05), transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* 呼吸与漂移火花动效 */
        @keyframes drift-glow {
            0% {
                text-shadow: 
                    0 0 10px rgba(234, 32, 39, 0.8),
                    -4px 4px 0px #EA2027,
                    -8px 8px 0px #EE5A24,
                    -12px 12px 0px #FFC312;
            }
            100% {
                text-shadow: 
                    0 0 25px rgba(238, 90, 36, 1),
                    -4px 4px 0px #EA2027,
                    -8px 8px 0px #EE5A24,
                    -12px 12px 0px #FFC312;
                transform: scale(1.02);
            }
        }

        /* 移动端响应式适配 */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* 允许手机端上下滚动查看公司信息 */
            }
            .navbar {
                padding: 0 20px;
            }
            .main-content {
                padding-top: 40px;
                padding-bottom: 40px;
            }
            .title {
                font-size: 3.5rem;
                text-shadow: 
                    -3px 3px 0px #EA2027,
                    -6px 6px 0px #EE5A24;
            }
            .subtitle {
                font-size: 1.2rem;
                letter-spacing: 3px;
                margin-top: 25px;
            }
            .footer-container {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            .footer-center {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部固定导航栏 -->
    <nav class="navbar">
        <a href="#" class="navbar-logo">frl games</a>
        <ul class="navbar-menu">
            <li class="nav-item">
                <a href="#about" class="nav-link">about</a>
            </li>
            <li class="nav-item dropdown">
                <a href="#game" class="nav-link">game ▾</a>
                <ul class="dropdown-menu">
                    <li class="dropdown-item"><a href="#fr-legends">fr legends</a></li>
                    <li class="dropdown-item"><a href="#fr-legends-2">fr legends 2</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="smoke-overlay"></div>

    <!-- 主视觉区 -->
    <div class="main-content">
        <div class="racing-line"></div>
        <h1 class="title">FRL GAMES</h1>
        <h2 class="subtitle">FR LEGENDS 2 COMING SOON</h2>
    </div>

    <!-- 公司信息页脚 -->
    <footer class="company-footer">
        <div class="footer-container">
            <!-- 左侧：公司名称与版权 -->
            <div class="footer-left">
                <div class="company-name">FRL GAMES LLC</div>
                <p>&copy; 2026 FRL GAMES LLC. All Rights Reserved.</p>
            </div>
            
            <!-- 中间：商务与联系链接 -->
            <div class="footer-center">
                <a href="mailto:support@frlgames.com">Contact: support@frlgames.com</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
            </div>
            
            <!-- 右侧：玩家社区/社交媒体入口 (如 X/Discord/YouTube) -->
            <div class="footer-right">
                <div class="social-links">
                    <a href="#discord" class="social-icon" title="Discord">DC</a>
                    <a href="#twitter" class="social-icon" title="Twitter/X">X</a>
                    <a href="#youtube" class="social-icon" title="YouTube">YT</a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
